name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Add Firebase config if present
        run: |
          if [ -f google-services.json ]; then
            cp google-services.json android/app/google-services.json
            echo "google-services.json found and copied."
          else
            echo "No google-services.json yet — skipping (push notifications won't work until you add one)."
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Bump Android target SDK to 36
        run: |
          sed -i 's/compileSdkVersion = 34/compileSdkVersion = 36/' android/variables.gradle
          sed -i 's/targetSdkVersion = 34/targetSdkVersion = 36/' android/variables.gradle

      - name: Make gradlew executable
        run: chmod +x andr

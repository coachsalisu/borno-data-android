name: Generate Signing Keystore (RUN ONCE ONLY)

# ⚠️ Only ever run this ONE time, ever. Running it again creates a
# DIFFERENT key, and if you ever publish with a second key, the Play
# Store will reject it as not matching your original app. If you're
# re-running this because something went wrong, stop and re-read the
# README "Publishing to the Play Store" section first.
on:
  workflow_dispatch:
    inputs:
      keystore_password:
        description: 'Password for the keystore — WRITE THIS DOWN before running'
        required: true
      key_alias:
        description: 'Key alias (just a name for the key, e.g. borno-data-key)'
        required: true
        default: 'borno-data-key'
      key_password:
        description: 'Password for the key itself — can be the same as above, WRITE IT DOWN'
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore release-key.jks \
            -alias "${{ github.event.inputs.key_alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ github.event.inputs.keystore_password }}" \
            -keypass "${{ github.event.inputs.key_password }}" \
            -dname "CN=Borno Data, OU=Borno Data, O=Borno Data, L=Maiduguri, ST=Borno, C=NG"

      - name: Also produce a base64 copy (for pasting into a GitHub Secret)
        run: base64 -w 0 release-key.jks > release-key-base64.txt

      - name: Upload keystore files
        uses: actions/upload-artifact@v4
        with:
          name: borno-data-keystore
          path: |
            release-key.jks
            release-key-base64.txt

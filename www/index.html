<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Borno Data</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.bornodata.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F1B2B;
    --ink-2:#182A40;
    --sand:#F3F6FB;
    --card:#FFFFFF;
    --blue:#2F5FDB;
    --blue-dark:#1B3E9C;
    --emerald:#1C9D6B;
    --coral:#E15B4D;
    --slate:#5E6B77;
    --slate-light:#9AA5AD;
    --line:#E1E5F0;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--sand);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  #shell{
    width:100%;
    max-width:440px;
    min-height:100vh;
    background:var(--sand);
    display:flex;
    flex-direction:column;
    position:relative;
  }
  h1,h2,h3{font-family:'Sora',sans-serif; margin:0;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  /* Header */
  #topbar{
    background:var(--sand);
    color:var(--ink);
    padding:18px 20px 4px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky; top:0; z-index:20;
  }
  #topbar .brand{
    font-family:'Sora',sans-serif;
    font-weight:800;
    font-size:17px;
    letter-spacing:-0.02em;
    display:flex;
    align-items:center;
    gap:8px;
  }
  #back-btn{
    background:none;border:none;color:var(--ink);font-size:15px;font-family:'Inter';
    display:flex;align-items:center;gap:6px;cursor:pointer;padding:4px 0;
  }

  /* Content */
  #content{
    flex:1;
    padding:6px 18px 110px;
    overflow-y:auto;
  }

  /* Greeting row */
  .greet-row{
    display:flex; align-items:center; justify-content:space-between;
    margin:6px 0 18px;
  }
  .greet-text .hi{font-size:12.5px; color:var(--slate); display:flex; align-items:center; gap:5px;}
  .greet-text h1{font-size:24px; letter-spacing:-0.02em; margin-top:2px;}
  .avatar-btn{
    width:42px; height:42px; border-radius:50%;
    background:var(--card); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:17px; color:var(--blue);
  }

  /* Balance card — gradient, matches brand blue */
  .balance-card{
    position:relative;
    border-radius:20px;
    padding:20px 20px 18px;
    background:linear-gradient(135deg, #4A7CF0 0%, var(--blue) 55%, var(--blue-dark) 100%);
    color:#fff;
    overflow:hidden;
    box-shadow:0 14px 26px -14px rgba(47,95,219,0.55);
  }
  .balance-label{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color:rgba(255,255,255,0.8);
    margin-bottom:8px;
    display:flex; align-items:center; gap:6px;
  }
  .balance-row{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .balance-amount{
    font-size:32px;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .eye-btn{
    background:transparent; border:none; color:rgba(255,255,255,0.85);
    cursor:pointer; font-size:14px; padding:0;
  }
  .account-row{
    margin-top:16px;
    background:rgba(255,255,255,0.14);
    border-radius:12px;
    padding:10px 12px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .account-row .acct-info{font-size:11.5px; color:rgba(255,255,255,0.85); line-height:1.5;}
  .account-row .acct-number{font-size:14px; font-weight:700; color:#fff; margin-top:1px;}
  .copy-btn{background:none; border:none; color:#fff; font-size:15px; cursor:pointer; flex-shrink:0;}

  .btn-row{display:flex; gap:10px; margin-top:16px;}
  .cashback-row{
    margin-top:12px; padding-top:12px; border-top:1px solid rgba(255,255,255,0.18);
    display:flex; align-items:center; justify-content:space-between; color:#fff; font-size:13px;
  }
  .withdraw-pill{
    background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.35); color:#fff;
    font-family:'Sora'; font-weight:700; font-size:11.5px; padding:7px 12px; border-radius:20px; cursor:pointer;
  }
  .withdraw-pill:disabled{opacity:0.45; cursor:not-allowed;}
  .pill-btn{
    flex:1; border-radius:12px; padding:13px 10px; font-family:'Sora'; font-weight:700; font-size:13.5px;
    display:flex; align-items:center; justify-content:center; gap:7px; cursor:pointer; border:none;
  }
  .pill-btn.primary{background:var(--ink); color:#fff;}
  .pill-btn.secondary{background:var(--card); color:var(--blue-dark); border:1.5px solid var(--line);}

  /* Services grid */
  .section-title{
    font-size:15px;
    color:var(--ink);
    margin:26px 0 12px;
    font-weight:700;
    font-family:'Sora';
  }
  .services-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
  }
  .service-tile{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px 6px 12px;
    text-align:center;
    cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:9px;
  }
  .service-tile .ic{
    width:44px;height:44px;
    border-radius:50%;
    background:#E9EFFC;
    display:flex;align-items:center;justify-content:center;
    font-size:18px; color:var(--blue);
  }
  .service-tile span{font-size:11.5px; font-weight:600; color:var(--ink);}

  /* Floating WhatsApp buttons — real WhatsApp icon + label pill underneath,
     matching how most Nigerian VTU apps present these. */
  .wa-fab-wrap{
    position:fixed; right:calc(50% - 220px + 18px);
    display:flex; flex-direction:column; align-items:center; gap:4px;
    z-index:25;
  }
  #channel-fab-wrap{ bottom:154px; }
  #support-fab-wrap{ bottom:86px; }
  .wa-fab-icon{
    width:52px; height:52px; border-radius:50%;
    background:#25D366; display:flex; align-items:center; justify-content:center;
    border:none; cursor:pointer; box-shadow:0 10px 20px -8px rgba(37,211,102,0.6);
  }
  .wa-fab-icon svg{ width:28px; height:28px; }
  .wa-fab-label{
    background:var(--ink); color:#fff; font-size:9.5px; font-weight:700;
    letter-spacing:0.03em; text-transform:uppercase; padding:2px 9px; border-radius:999px;
  }
  @media (max-width:440px){ .wa-fab-wrap{ right:18px; } }

  /* Auth screen */
  .auth-hero{
    background:var(--ink); color:#fff;
    margin:-6px -18px 0; padding:44px 20px 50px;
  }
  .auth-hero h1{font-size:28px; line-height:1.15; letter-spacing:-0.02em;}
  .auth-sheet{
    background:var(--card); border-radius:22px 22px 0 0;
    margin:-26px -18px 0; padding:26px 20px 10px; position:relative;
  }
  .input-wrap{position:relative;}
  .input-wrap input{padding-right:42px;}
  .input-check{position:absolute; right:12px; top:50%; transform:translateY(-50%);
    width:20px; height:20px; border-radius:50%; background:var(--emerald); color:#fff;
    font-size:11px; display:flex; align-items:center; justify-content:center;}
  .eye-toggle-input{position:absolute; right:10px; top:50%; transform:translateY(-50%);
    background:none; border:none; cursor:pointer; color:var(--slate); font-size:15px; padding:4px;}
  .valid-msg{font-size:11.5px; color:var(--emerald); margin-top:5px; display:flex; align-items:center; gap:5px;}
  .invalid-msg{font-size:11.5px; color:var(--coral); margin-top:5px;}
  .terms-row{display:flex; align-items:flex-start; gap:9px; margin:18px 0 4px; font-size:12.5px; color:var(--slate); line-height:1.4;}
  .terms-row input{margin-top:3px; flex-shrink:0;}
  .switch-link{text-align:center; margin:18px 0 6px; font-size:12.5px; color:var(--slate);}
  .switch-link a{color:var(--blue-dark); font-weight:700; cursor:pointer;}

  /* PIN entry */
  .pin-input{
    width:100%; text-align:center; font-size:28px; letter-spacing:20px;
    padding:16px 0 16px 20px; border-radius:12px; border:1.5px solid var(--line);
    font-family:'IBM Plex Mono',monospace; margin-top:6px;
  }

  /* Transaction list */
  .tx-row{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:8px;
  }
  .tx-icon{
    width:36px;height:36px;border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    font-size:14px; font-weight:700; flex-shrink:0;
  }
  .tx-mid{flex:1; min-width:0;}
  .tx-title{font-size:13.5px; font-weight:600; color:var(--ink);}
  .tx-sub{font-size:11.5px; color:var(--slate); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tx-amt{font-size:13.5px; font-weight:600;}
  .tx-amt.neg{color:var(--coral);}
  .tx-amt.pos{color:var(--emerald);}
  .chat-pill{
    background:#25D366; color:#fff; border:none; border-radius:999px;
    padding:8px 16px; font-size:12.5px; font-weight:700; font-family:'Inter',sans-serif;
    flex-shrink:0; cursor:pointer;
  }
  .site-banner{
    display:flex; align-items:center; gap:10px;
    background:#EEF2FF; border:1px solid var(--blue); border-radius:10px;
    padding:10px 12px; margin-bottom:14px; font-size:12.5px; color:var(--blue-dark);
  }
  .site-banner-text{flex:1;}
  .site-banner-close{background:none; border:none; font-size:18px; line-height:1; color:var(--blue-dark); cursor:pointer; padding:0 4px;}

  /* Lock screen (PIN + fingerprint combined) */
  .lock-wrap{display:flex; flex-direction:column; align-items:center; padding:56px 24px 0; min-height:80vh;}
  .lock-avatar{
    width:76px; height:76px; border-radius:50%; background:var(--blue);
    color:#fff; font-size:30px; font-weight:800; font-family:'Sora';
    display:flex; align-items:center; justify-content:center; margin-bottom:16px;
  }
  .lock-title{font-size:19px; margin:0 0 20px;}
  .lock-dots{display:flex; gap:16px; margin-bottom:20px;}
  .lock-dot{width:14px; height:14px; border-radius:50%; border:1.5px solid var(--slate);}
  .lock-dot.filled{background:var(--blue); border-color:var(--blue);}
  .lock-keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:18px; width:100%; max-width:280px; margin-top:8px;}
  .lock-key{
    aspect-ratio:1; border-radius:50%; border:none; background:var(--card);
    box-shadow:0 1px 3px rgba(15,27,43,0.08); font-size:22px; font-weight:600;
    color:var(--ink); font-family:'Inter'; display:flex; align-items:center; justify-content:center;
  }
  .lock-key-ghost{background:none; box-shadow:none; font-size:20px;}
  .lock-signout{margin-top:32px; background:none; border:none; color:var(--coral); font-size:13px; font-weight:600; font-family:'Inter';}

  /* Onboarding (native app only, shown once before first login) */
  .onboarding-wrap{display:flex; flex-direction:column; align-items:center; padding:48px 26px 20px; min-height:88vh; text-align:center;}
  .onboarding-art{
    width:220px; height:220px; border-radius:50%; background:#EEF2FF;
    display:flex; align-items:center; justify-content:center; font-size:88px;
    margin-bottom:36px;
  }
  .onboarding-title{font-size:22px; margin:0 0 12px; font-family:'Sora';}
  .onboarding-body{font-size:13.5px; color:var(--slate); line-height:1.5; max-width:300px;}
  .onboarding-dots{display:flex; gap:7px; margin:28px 0;}
  .onboarding-dot{width:7px; height:7px; border-radius:50%; background:var(--line);}
  .onboarding-dot.active{width:20px; border-radius:4px; background:var(--blue);}
  .onboarding-actions{display:flex; align-items:center; gap:22px; margin-top:auto; width:100%;}
  .onboarding-actions .primary-btn{flex:1; margin:0;}
  .onboarding-actions button:last-child{background:none; border:none; font-size:14px; font-weight:700; color:var(--ink); font-family:'Inter';}

  .refresh-btn{
    background:none; border:none; font-size:20px; color:var(--ink);
    width:34px; height:34px; flex-shrink:0; margin-right:2px;
  }
  .refresh-btn.spinning{animation:spin .8s linear infinite;}

  .promo-carousel{overflow:hidden; border-radius:12px; margin-top:16px;}
  .promo-track{display:flex; transition:transform .3s ease;}
  .promo-slide{
    flex:0 0 100%; display:flex; align-items:center; gap:12px;
    padding:14px 16px; color:#fff; min-height:64px;
  }
  .promo-emoji{font-size:26px; flex-shrink:0;}
  .promo-title{font-size:13px; font-weight:700;}
  .promo-sub{font-size:11px; opacity:0.85; margin-top:1px;}
  .promo-dots{display:flex; justify-content:center; gap:6px; margin-top:8px;}
  .promo-dot{width:6px; height:6px; border-radius:50%; background:var(--line);}
  .promo-dot.active{width:16px; border-radius:3px; background:var(--blue);}
  .empty-state{
    text-align:center; padding:40px 10px; color:var(--slate); font-size:13px;
  }

  /* Provider grid (networks / TV) */
  .provider-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:20px;}
  .provider-card{
    border-radius:12px; padding:16px 12px; cursor:pointer; border:2px solid transparent;
    font-family:'Sora',sans-serif; font-weight:700; font-size:14px; color:#fff;
    text-align:center;
  }
  .provider-card.selected{border-color:var(--ink); box-shadow:0 0 0 2px var(--blue);}

  .field-label{font-size:12px; font-weight:600; color:var(--slate); margin:16px 0 6px; text-transform:uppercase; letter-spacing:0.05em;}
  .checkbox-row{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--slate); margin-top:12px; padding:10px 12px; background:var(--card); border:1px solid var(--line); border-radius:10px;}
  .checkbox-row input{width:16px; height:16px; flex-shrink:0;}
  .pill-toggle-row{display:flex; gap:8px; flex-wrap:wrap;}
  .pill-toggle{
    background:var(--card); border:1.5px solid var(--blue); color:var(--blue-dark);
    border-radius:999px; padding:8px 16px; font-size:12.5px; font-weight:700;
    font-family:'Inter',sans-serif; cursor:pointer;
  }
  .pill-toggle.selected{background:var(--blue); color:#fff;}
  input[type=text], input[type=tel], input[type=number], input[type=password]{
    width:100%; padding:13px 14px; border-radius:10px; border:1.5px solid var(--line);
    font-size:15px; font-family:'IBM Plex Mono',monospace; background:var(--card); color:var(--ink);
  }
  input:focus{outline:none; border-color:var(--blue-dark);}

  .plan-list{display:flex; flex-direction:column; gap:8px; margin-top:6px;}
  .plan-row{
    background:var(--card); border:1.5px solid var(--line); border-radius:12px;
    padding:13px 14px; display:flex; justify-content:space-between; align-items:center; cursor:pointer;
  }
  .plan-row.selected{border-color:var(--blue-dark); background:#FFF7EA;}
  .plan-name{font-size:13.5px; font-weight:600; color:var(--ink);}
  .plan-sub{font-size:11px; color:var(--slate); margin-top:2px;}
  .plan-price{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13.5px; color:var(--ink);}

  .primary-btn{
    width:100%; padding:15px; border:none; border-radius:12px; margin-top:22px;
    background:var(--ink); color:var(--sand); font-family:'Sora',sans-serif;
    font-weight:700; font-size:14.5px; cursor:pointer;
  }
  .primary-btn:disabled{background:#C9CDD3; color:#7A828A; cursor:not-allowed;}
  .primary-btn.confirm{background:var(--emerald);}

  .disco-list{display:flex; flex-direction:column; gap:8px; margin-top:6px;}
  .disco-row{
    background:var(--card); border:1.5px solid var(--line); border-radius:10px;
    padding:12px 14px; font-size:13.5px; font-weight:600; cursor:pointer;
  }
  .disco-row.selected{border-color:var(--blue-dark); background:#FFF7EA;}

  /* Bottom nav */
  #bottomnav{
    position:sticky; bottom:0; left:0; right:0;
    background:var(--card);
    border-top:1px solid var(--line);
    display:flex;
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));
    z-index:20;
  }
  .nav-item{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:6px 0; cursor:pointer; color:var(--slate-light); font-size:10.5px; font-weight:600;
    border:none; background:none; font-family:'Inter';
  }
  .nav-item.active{color:var(--ink);}
  .nav-item .dot{width:5px;height:5px;border-radius:50%; background:var(--blue); opacity:0; margin-top:1px;}
  .nav-item.active .dot{opacity:1;}

  /* Toast */
  #toast{
    position:fixed; bottom:90px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:var(--sand); padding:12px 20px; border-radius:10px;
    font-size:13px; font-weight:600; opacity:0; pointer-events:none; transition:all .25s ease;
    z-index:50; white-space:nowrap; box-shadow:0 8px 20px -6px rgba(0,0,0,0.4);
    display:flex; align-items:center; gap:8px;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* Modal */
  #modal-overlay{
    position:fixed; inset:0; background:rgba(15,27,43,0.55); display:none;
    align-items:flex-end; justify-content:center; z-index:60;
  }
  #modal-overlay.show{display:flex;}
  #modal{
    background:var(--card); width:100%; max-width:440px; border-radius:20px 20px 0 0;
    padding:22px 20px calc(22px + env(safe-area-inset-bottom)); max-height:80vh; overflow-y:auto;
  }
  .modal-handle{width:36px; height:4px; background:var(--line); border-radius:2px; margin:0 auto 16px;}

  .loading-wrap{display:flex; align-items:center; justify-content:center; height:60vh; color:var(--slate); font-size:13px; gap:10px;}
  .spinner{width:16px;height:16px;border:2px solid var(--line); border-top-color:var(--ink); border-radius:50%; animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* Shown the instant a purchase is submitted, until the server responds —
     this is the fix for "nothing tells me it's working," which was leading
     people to tap Buy again out of uncertainty. Sits above everything,
     including open modals, and blocks taps underneath it (pointer-events
     auto by default since it's a normal block element in the flow). */
  #processing-overlay{
    position:fixed; inset:0; background:rgba(15,27,43,0.75); z-index:200;
    display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; color:#fff; font-size:14px; font-weight:600; text-align:center; padding:20px;
  }
  #processing-overlay.show{display:flex;}
  #processing-overlay .spinner{width:28px; height:28px; border-width:3px; border-color:rgba(255,255,255,0.3); border-top-color:#fff;}
  .processing-hint{font-size:12px; font-weight:400; color:rgba(255,255,255,0.75); margin-top:-4px;}
</style>
</head>
<body>
<div id="shell">
  <div id="topbar">
    <div class="brand"><img src="https://bornodata.com/logo-header.png" alt="Borno Data" style="height:26px; width:auto;">Borno Data</div>
  </div>
  <div id="content"></div>

// which provides a `window.storage` API for saving data. That API does

// would be undefined and every save/load would throw. This polyfill fills
// it in with localStorage whenever the real thing isn't present, so the
// exact same code works both in preview and on the live site.
if(!window.storage){
  window.storage = {
    async get(key){
      const v = localStorage.getItem(key);
      if(v === null) throw new Error("not found");
      return { key, value: v };
    },
    async set(key, value){
      localStorage.setItem(key, value);
      return { key, value };
    },
    async delete(key){
      localStorage.removeItem(key);
      return { key, deleted: true };
    },
    async list(prefix){
      const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix));
      return { keys };
    },
  };
}

async function apiRequest(path, opts = {}){
  const headers = { "Content-Type": "application/json" };
  if(session?.token) headers.Authorization = "Bearer " + session.token;
  const res = await fetch(API_BASE_URL + path, { ...opts, headers });
  const data = await res.json().catch(() => ({}));
  if(!res.ok){
    const err = new Error(data.error || "Something went wrong");
    err.status = res.status;
    err.detail = data.detail;
    throw err;
  }
  return data;
}

// Local, insecure stand-in for the backend so the signup/login flow is
// testable before a real server exists. NOT how real passwords should ever
// be stored — this only runs when API_BASE_URL is left empty.
async function demoAuth(mode, {email, password, fullName, phone}){
  const key = "borno-data-demo-users";
  let users = {};
  try{ users = JSON.parse((await window.storage.get(key, false)).value); }catch(e){}
  const normalized = (email || "").toLowerCase().trim();

  if(mode === "signup"){
    if(!normalized || !normalized.includes("@")) throw new Error("Enter a valid email");
    if(!password || password.length < 8) throw new Error("Password must be at least 8 characters");
    if(users[normalized]) throw new Error("An account with that email already exists");
    users[normalized] = { password, fullName: fullName || "", phone: phone || "" };
    await window.storage.set(key, JSON.stringify(users), false);
    return { token: "demo-" + normalized, user: { email: normalized, fullName: fullName || "" } };
  } else {
    const u = users[normalized];
    if(!u || u.password !== password) throw new Error("Incorrect email or password");
    return { token: "demo-" + normalized, user: { email: normalized, fullName: u.fullName } };
  }
}

// Registers this device for push notifications — only does anything when
// running inside the real Android app (via Capacitor), never inside a
// regular browser tab, since window.Capacitor only exists in the native
// shell.
//
// ⚠️ NOT CALLED AUTOMATICALLY YET. Calling PushNotifications.register()
// before the native project has a real Firebase project connected
// (google-services.json + the Firebase Gradle setup — see README "Push
// Notifications") crashes the whole app on some devices, because the
// plugin's Android code assumes Firebase is already initialized and
// throws natively when it isn't — a crash at that layer can't be caught
// by a JS try/catch here, so guarding it in JavaScript doesn't fully fix
// it. Once Firebase is genuinely set up, re-add the two lines
//   `setupPushNotifications();`
// right after `refreshBiometricStatus();` above and after the same line
// in submitAuth() (search for "refreshBiometricStatus();" — there are two
// call sites) to turn this back on.
async function setupPushNotifications(){
  if(!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())) return;
  try{
    const { PushNotifications } = window.Capacitor.Plugins || {};
    if(!PushNotifications) return;
    const perm = await PushNotifications.requestPermissions();
    if(perm.receive !== "granted") return;
    await PushNotifications.register();
    PushNotifications.addListener("registration", async (token) => {
      try{ await apiRequest("/api/push/register-token", { method: "POST", body: JSON.stringify({ token: token.value, platform: "android" }) }); }
      catch(e){ console.error("Could not register push token", e); }
    });
    PushNotifications.addListener("registrationError", (err) => console.error("Push registration error", err));
    PushNotifications.addListener("pushNotificationReceived", (notification) => {
      toast(notification.title || notification.body || "New notification");
    });
  }catch(e){ console.error("Push setup failed", e); }
}

/* ---------- Fingerprint unlock ---------- */
// Not a replacement for the password — the account still logs in with
// email+password exactly as before. This only gates access to a session
// that's ALREADY valid on this device: fingerprint success just means
// "let this app open", using the token already saved from the last real
// login. If someone turns fingerprint off, or it's unavailable, the app
// just goes straight to home as it always has.

async function biometricAvailable(){
  if(!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())) return false;
  try{
    const { NativeBiometric } = window.Capacitor.Plugins || {};
    if(!NativeBiometric) return false;
    const result = await NativeBiometric.isAvailable();
    return Boolean(result?.isAvailable);
  }catch(e){ return false; }
}

async function enableBiometricLock(){
  const available = await biometricAvailable();
  if(!available){ toast("Fingerprint isn't set up on this device"); return; }
  try{ await window.storage.set(biometricKey(), "true", false); toast("✓ Fingerprint unlock enabled"); refreshBiometricStatus(); }
  catch(e){ toast("Could not enable fingerprint unlock"); }
}
async function disableBiometricLock(){
  try{ await window.storage.set(biometricKey(), "false", false); toast("Fingerprint unlock turned off"); refreshBiometricStatus(); }

}

const BACKGROUND_AT_KEY = "borno-data-last-backgrounded";
const INACTIVITY_LOCK_MS = 30 * 60 * 1000; // 30 minutes

async function recordBackgrounded(){
  try{ await window.storage.set(BACKGROUND_AT_KEY, String(Date.now()), false); }catch(e){}
}

// Called whenever the app comes back to the foreground — from switching
// apps, or from reopening after being fully closed (the timestamp survives
// that via window.storage, unlike an in-memory variable).
async function handleForeground(){
  if(!session || view === "lock" || view === "auth" || view === "onboarding") return;
  let elapsed = 0;
  try{
    const res = await window.storage.get(BACKGROUND_AT_KEY, false);
    const backgroundedAt = Number(res.value) || 0;
    elapsed = backgroundedAt ? Date.now() - backgroundedAt : 0;
  }catch(e){}
  if(elapsed > INACTIVITY_LOCK_MS){
    lockApp(); // lockApp() itself decides whether locking is even possible (falls back to full sign-out if no PIN/fingerprint is set)
    return;
  }
  // Otherwise, just quietly pull fresh numbers — covers "I got a funding
  // alert while the app was in the background" without extra taps.
  loadState(false);
}

function setupLifecycleListeners(){
  document.addEventListener("visibilitychange", () => {
    if(document.visibilityState === "hidden") recordBackgrounded();
    else handleForeground();
  });
  if(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()){
    const { App } = window.Capacitor.Plugins || {};
    if(App){
      App.addListener("appStateChange", ({ isActive }) => {
        if(!isActive) recordBackgrounded();
        else handleForeground();
      });
    }
  }
}

async function attemptBiometricUnlock(){
  try{
    const { NativeBiometric } = window.Capacitor.Plugins || {};
    if(!NativeBiometric){ view = "home"; render(); return; }
    await NativeBiometric.verifyIdentity({ reason: "Unlock Borno Data", title: "Biometric login", subtitle: "", description: "" });
    // No exception thrown = verified successfully.
    sub.lockPin = "";
    view = "home";
    history.replaceState({ view }, "", "");
    refreshBiometricStatus();
  }catch(e){
    // Cancelled or failed — stay on the lock screen; the keypad is right
    // there for entering the PIN instead, no separate fallback screen needed.
  }
}

async function saveSession(){
  try{ await window.storage.set(SESSION_KEY, JSON.stringify(session), false); }catch(e){}
}

// Locks the app without discarding the session — the PIN/fingerprint
// lock screen is shown, but the same account's token stays valid
// underneath, so re-entering the right PIN gets straight back in. This is
// what "Log out" on the Me page and background inactivity both use now,
// rather than a full logout, which used to force retyping the whole
// email/password every single time.
function lockApp(){
  // Locking only makes sense if there's something to unlock WITH — if
  // this account has never set a PIN and doesn't have fingerprint turned
  // on, a "lock screen" would just accept anything typed into it, which
  // isn't actually securing anything. In that case, do a real sign-out
  // instead so nothing looks falsely protected.
  if(!state.hasTransactionPin && !biometricEnabledCache){ clearSession(); return; }
  view = "lock";
  sub.lockPin = "";
  sub.lockError = "";
  history.replaceState({ view }, "", "");
  render();
}

// The real, full sign-out — discards the session entirely, so the next
// person has to log in from scratch. This is what "Switch account" uses,
// both on the Me page and from the lock screen's own link.
async function clearSession(){
  session = null;
  state = null;
  try{ await window.storage.delete(SESSION_KEY, false); }catch(e){}
  view = "auth";
  history.replaceState({ view }, "", "");
  render();
}

async function submitAuth({email, password, fullName, phone}){
  authError = "";
  if(!email || !password){ authError = authMode === "login" ? "Enter your email/phone and password" : "Enter your email and password"; render(); return; }
  if(authMode === "signup" && (!password || password.length < 8)){
    authError = "Password must be at least 8 characters"; render(); return;
  }
  try{
    const result = API_BASE_URL
      ? await apiRequest("/api/auth/" + authMode, { method:"POST", body: JSON.stringify({email, password, fullName, phone, referralCode: incomingReferralCode}) })
      : await demoAuth(authMode, {email, password, fullName, phone});
    const isSignup = authMode === "signup";
    session = { email: result.user.email, fullName: result.user.fullName, token: result.token };
    await saveSession();
    view = "home";
    history.replaceState({ view }, "", ""); // fresh stack base after login, rather than stacking on top of the auth screen
    sub = {};
    await loadState();
    loadSiteSettings();
    // setupPushNotifications() intentionally not called yet — see the big
    // comment on that function.
    refreshBiometricStatus();
    if(isSignup) startPinSetup();
  }catch(e){
    authError = e.message || "Something went wrong";
    render();
  }
}

function toast(msg){

  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove("show"), 2200);
}

function closeModal(){
  document.getElementById("modal-overlay").classList.remove("show");
}
function openModal(html){
  document.getElementById("modal").innerHTML = html;
  document.getElementById("modal-overlay").classList.add("show");
}

// Pushes a real browser history entry per in-app view, so the phone's back
// button steps backward through the app one screen at a time — the way
// every native app and most web apps behave — instead of immediately
// exiting to whatever was open before Borno Data (a browser tab list, the
// home screen, etc). `fromPopstate` is true only when this function is
// called *because* the back button was pressed — in that case the browser
// already moved the history position itself, so pushing another entry
// would double up and break the back stack.
function goto(v, fromPopstate){
  view = v;
  sub = {};
  if(!fromPopstate) history.pushState({ view: v }, "", "");
  render();
  document.getElementById("content").scrollTop = 0;
  // Quietly pulls fresh balance/history whenever Home becomes the visible
  // screen again — covers "I just bought data, tapped back, and want to
  // see it reflected" without a manual refresh tap.
  if(v === "home" && session) loadState(false);
}

window.addEventListener("popstate", (e) => {
  // If a modal is open, treat back as "close the modal" first rather than
  // also changing the view underneath it — closing modal state doesn't
  // consume the history entry (we didn't push one for opening it), so nav
  // still proceeds below, but this avoids yanking the view out from under
  // an open confirm/receipt dialog.
  const modalOpen = document.getElementById("modal-overlay")?.classList.contains("show");
  if(modalOpen) closeModal();
  const targetView = e.state?.view || "home";
  goto(targetView, true);
});

// Live-validation fields call this instead of render() directly. A normal
// render() rebuilds the whole screen from scratch, which kicks the cursor
// out of whatever input is being typed in — this restores focus and cursor
// position afterward so typing feels continuous instead of one key at a time.
function rerenderKeepingFocus(){
  const active = document.activeElement;
  const id = active && active.id;
  const start = active && typeof active.selectionStart === "number" ? active.selectionStart : null;
  const end = active && typeof active.selectionEnd === "number" ? active.selectionEnd : null;
  render();
  if(id){
    const el = document.getElementById(id);
    if(el){
      el.focus();
      if(start !== null && el.setSelectionRange){
        try{ el.setSelectionRange(start, end); }catch(e){}
      }
    }
  }
}

// Every purchase flow calls this. It posts to the backend, and on success
// refreshes the wallet from the server so the balance and history shown are
// always the real ones — never a locally-guessed number.
// A single in-flight guard, shared by every purchase call site (data,
// airtime, TV, exam pins, etc) — this is the fix for the "had to buy twice"
// problem: without it, a fast double-tap on Confirm (natural when nothing
// visibly changes the instant you tap) could fire two real requests to the
// provider before the first one's response ever comes back. Guarding here,
// in the one function every purchase flows through, protects all of them
// at once rather than needing the same fix repeated in every handler.
let purchaseInFlight = false;
async function purchase(path, body){
  if(purchaseInFlight){
    toast("Still processing your last request — please wait");
    return null;
  }
  purchaseInFlight = true;
  document.getElementById("processing-overlay").classList.add("show");
  try{
    const data = await apiRequest(path, { method: "POST", body: JSON.stringify(body) });
    if(data.wallet){
      // The server already sent back the fresh balance/history (and
      // hasTransactionPin) with this same response — apply it directly
      // instead of firing a second request just to ask for what we were
      // already just told.
      state = { ...state, ...data.wallet };
      render();
    } else {
      await loadState(false);
    }
    return data;
  }catch(e){
    toast(e.message || "Something went wrong");
    return null;
  }finally{
    purchaseInFlight = false;
    document.getElementById("processing-overlay").classList.remove("show");
  }
}

}

// Fetches real, current data plans (with real network IDs) from the
// backend, which proxies Elhassandatalink directly — no more guessed
// network IDs or stale pricing. Cached in `sub` so switching screens
// doesn't re-fetch every time; call again after clearing sub.dataPlans
// to force a retry.
let dataPlansLoadPromise = null;
async function loadDataPlans(){
  if(dataPlansLoadPromise) return dataPlansLoadPromise;
  sub.dataPlansLoading = true;
  dataPlansLoadPromise = (async () => {
    try{
      const raw = await apiRequest("/api/data/plans");
      sub.dataPlans = (raw.networks || []).map(n => {
        const netName = (n.name || "").toUpperCase();
        const style = NETWORK_COLOR_MAP[netName] || {color:"#333333", text:"#FFFFFF"};
        return { id: String(n.networkId), networkId: n.networkId, name: n.name, color: style.color, text: style.text, plans: n.plans || [] };
      });
      sub.dataPlansError = null;
    }catch(e){
      sub.dataPlansError = e.message || "Could not load data plans";
    }
    sub.dataPlansLoading = false;
    dataPlansLoadPromise = null;
    render();
  })();
  return dataPlansLoadPromise;
}

function renderDataCategory(){
  if(sub.dataPlansError){
    return `<div class="empty-state" style="padding:40px 16px; text-align:center;">Could not load data plans right now.<br><span style="font-size:11.5px;">${sub.dataPlansError}</span></div>
      <button class="primary-btn" id="btn-retry-plans">Try again</button>`;
  }
  if(!sub.dataPlans){
    if(!sub.dataPlansLoading) loadDataPlans();
    return `<div class="loading-wrap"><div class="spinner"></div>Loading data plans…</div>`;
  }
  const networks = sub.dataPlans;
  const selectedProvider = networks.find(n => n.id === sub.providerId);

  let html = `<div class="section-title" style="margin-top:4px;">Choose network</div>
    <div class="provider-grid">
      ${networks.map(p => `
        <div class="provider-card ${sub.providerId===p.id?'selected':''}" style="background:${p.color};color:${p.text};" data-provider="${p.id}" data-kind="data">
          ${p.name}
        </div>`).join("")}
    </div>`;

  if(selectedProvider){
    const allTypesInNetwork = [...new Set(selectedProvider.plans.map(pl => pl.planType || "SME"))];
    // Preserve a sensible order (SME first, matching TrueData) rather than
    // whatever order the plans happened to come back in.
    const typeOrder = ["SME", "SME2", "GIFTING", "CORPORATE"];
    const availableTypes = typeOrder.filter(t => allTypesInNetwork.includes(t));
    if(!sub.dataPlanType || !availableTypes.includes(sub.dataPlanType)) sub.dataPlanType = availableTypes[0];
    const visiblePlans = selectedProvider.plans.filter(pl => (pl.planType || "SME") === sub.dataPlanType);

    html += `<div class="field-label">Phone number</div>
      <input type="tel" id="input-target" placeholder="080X XXX XXXX" value="${sub.target||''}" maxlength="16">`;

    if(availableTypes.length > 1){
      html += `<div class="field-label">Plan Type</div>
      <div class="pill-toggle-row">
        ${availableTypes.map(t => `<button class="pill-toggle ${sub.dataPlanType===t?'selected':''}" data-data-plan-type="${t}">${t}</button>`).join("")}
      </div>`;
    }

    html += `<div class="field-label">Choose data plan</div>
      <div class="plan-list">
        ${visiblePlans.map(pl => `
          <div class="plan-row ${sub.planId===pl.id?'selected':''}" data-plan="${pl.id}">
            <div>
              <div class="plan-name">${pl.name}</div>
              <div class="plan-sub">${pl.sub}</div>
            </div>
            <div class="plan-price mono">${naira(pl.price)}</div>

}

/* ---------- TRANSACTION PIN ---------- */

function pinModalHtml({title, subtitle, buttonLabel, error}){
  return `
    <div class="modal-handle"></div>
    <div style="text-align:center;">
      <div style="font-size:30px;">&#128274;</div>
      <h3 style="margin:10px 0 6px;">${title}</h3>
      <div style="font-size:12.5px; color:var(--slate);">${subtitle}</div>
      <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" id="pin-input" class="pin-input" autocomplete="off">
      ${error ? `<div class="invalid-msg" style="text-align:center; margin-top:8px;">${error}</div>` : ''}
      <button class="primary-btn confirm" id="btn-pin-submit" style="margin-top:18px;" disabled>${buttonLabel}</button>
    </div>
  `;
}

function wirePinInput(onComplete){
  const input = document.getElementById("pin-input");
  const btn = document.getElementById("btn-pin-submit");
  if(!input || !btn) return;
  input.focus();
  input.oninput = () => {
    input.value = input.value.replace(/\D/g,"").slice(0,4);
    btn.disabled = input.value.length !== 4;
  };
  btn.onclick = () => onComplete(input.value);
}

function startPinSetup(){
  openModal(pinModalHtml({ title: state.hasTransactionPin ? "Change PIN" : "Secure Wallet", subtitle:"Set up a 4-digit PIN for transactions", buttonLabel:"Set Transaction PIN" }));
  wirePinInput((value) => {
    sub.pinFirst = value;
    openModal(pinModalHtml({ title:"Confirm PIN", subtitle:"Re-enter your 4-digit PIN", buttonLabel:"Confirm PIN" }));
    wirePinInput(async (confirmValue) => {
      if(confirmValue === sub.pinFirst){
        closeModal();
        // Changing an existing PIN needs the old one too (checked server-side,
        // same as change-password) — setting the first one ever doesn't.
        const currentPin = state.hasTransactionPin ? await promptCurrentPinThen() : null;
        if(state.hasTransactionPin && currentPin === null) return; // they cancelled
        try{
          await apiRequest("/api/auth/set-pin", { method: "POST", body: JSON.stringify({ pin: confirmValue, currentPin }) });
          state.hasTransactionPin = true;
          toast("✓ Transaction PIN set");
          render();
        }catch(e){
          toast(e.message || "Could not set PIN");
        }
      } else {
        toast("PINs didn't match — try again");
        startPinSetup();
      }
    });
  });
}

// Small helper used only when CHANGING an existing PIN — collects the
// current PIN in its own short modal step, resolving to null if the person
// backs out instead of entering one.
function promptCurrentPinThen(){
  return new Promise((resolve) => {
    openModal(pinModalHtml({ title:"Confirm it's you", subtitle:"Enter your current PIN to continue", buttonLabel:"Continue" }));
    wirePinInput((value) => { closeModal(); resolve(value); });
  });
}

// Gate any purchase behind the transaction PIN, if one is set. The PIN
// itself is never checked here in the browser — it's collected and handed
// straight to purchaseFn, which sends it to the server as part of the same
// request that actually charges the wallet. That's what makes this secure:
// a hash comparison happening in the browser could be read or skipped
// entirely by anyone poking at the page's code; a check the server itself
// performs before moving any money cannot be.
function requirePinThen(purchaseFn){
  if(!state.hasTransactionPin){ purchaseFn(null); return; }

  openModal(pinModalHtml({ title:"Enter PIN", subtitle:"Enter your transaction PIN to continue", buttonLabel:"Confirm" }));
  wirePinInput((value) => {
    closeModal();
    purchaseFn(value);
  });
}

  if(smsMessage) smsMessage.oninput = (e) => { sub.smsMessage = e.target.value; rerenderKeepingFocus(); };
  const smsBtn = document.getElementById("btn-sms-continue");
  if(smsBtn) smsBtn.onclick = () => {
    const count = (sub.smsRecipients || "").split(/[\n,]+/).map(s => s.trim()).filter(Boolean).length;
    const total = count * SMS_UNIT_PRICE;
    openModal(confirmModalHtml({
      title: "Confirm bulk SMS",
      lines: [
        ['Recipients', String(count)],
        ['Cost per SMS', naira(SMS_UNIT_PRICE)],
        ['Total', naira(total), true],
      ],
    }));
    document.getElementById("btn-final-confirm").onclick = () => {
      closeModal();
      requirePinThen(async (pin) => {
        const result = await purchase("/api/sms/send", { count, message: sub.smsMessage, amount: total, pin });
        if(result){ toast("✓ Message sent to " + count + " number" + (count===1?'':'s')); sub={}; goto("home"); }
      });
    };
  };

  document.querySelectorAll("[data-recharge-denom]").forEach(el => {
    el.onclick = () => { sub.denom = el.getAttribute("data-recharge-denom"); render(); };
  });
  const rechargeQty = document.getElementById("input-recharge-qty");
  if(rechargeQty) rechargeQty.oninput = (e) => { sub.qty = Math.max(1, Math.min(20, Number(e.target.value) || 1)); rerenderKeepingFocus(); };
  const rechargeBtn = document.getElementById("btn-recharge-continue");
  if(rechargeBtn) rechargeBtn.onclick = () => {
    const provider = NETWORKS.find(p => p.id === sub.providerId);
    const denom = Number(sub.denom || AIRTIME_AMOUNTS[0]);
    const qty = Number(sub.qty || 1);
    const total = denom * qty;
    openModal(confirmModalHtml({
      title: "Confirm recharge pin purchase",
      lines: [
        ['Network', provider.name],
        ['Denomination', naira(denom)],
        ['Quantity', String(qty)],
        ['Total', naira(total), true],
      ],
    }));
    document.getElementById("btn-final-confirm").onclick = () => {
      closeModal();
      requirePinThen(async (pin) => {
        const result = await purchase("/api/recharge/purchase", { network: provider.id, denom, qty, amount: total, pin });
        if(result){
          const pins = (result.pins || []).join(", ");
          openModal(`<div class="modal-handle"></div><h3 style="margin-bottom:10px;">Your pin${qty>1?'s':''}</h3>
            <div class="empty-state" style="text-align:left; padding:10px 0;">${pins}</div>
            <button class="primary-btn confirm" id="btn-close-pins">Done</button>`);
          document.getElementById("btn-close-pins").onclick = () => { closeModal(); goto("home"); };
        }
      });
    };
  };

  document.getElementById("modal-overlay").onclick = (e) => {
    if(e.target.id === "modal-overlay") closeModal();
  };
}

function attachModalFundHandlers(){
  document.querySelectorAll("[data-fund-amt]").forEach(el => {
    el.onclick = async () => {
      const amt = Number(el.getAttribute("data-fund-amt"));
      closeModal();
      const result = await purchase("/api/wallet/dev-fund", { amount: amt });
      if(result) toast("✓ " + naira(amt) + " added to wallet");
    };
  });
  document.getElementById("btn-fund-confirm").onclick = async () => {
    const amt = Number(document.getElementById("custom-fund").value);
    if(!amt || amt <= 0){ toast("Enter a valid amount"); return; }
    closeModal();
    const result = await purchase("/api/wallet/dev-fund", { amount: amt });
    if(result) toast("✓ " + naira(amt) + " added to wallet");
  };
}

(async () => {
  setupLifecycleListeners();
  const params = new URLSearchParams(window.location.search);
  if(params.get("ref")){
    incomingReferralCode = params.get("ref").trim().toUpperCase();
    authMode = "signup";
  } else if(params.get("mode") === "signup"){
    authMode = "signup";
  }
  await loadSession();

  if(!session){
    // Onboarding only ever appears inside the real installed app (never on
    // the website — window.Capacitor doesn't exist in a regular browser
    // tab), and only the very first time, before anyone has signed up or
    // logged in on this device.
    const isNative = Boolean(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
    let seenOnboarding = true;
    if(isNative){
      try{ seenOnboarding = (await window.storage.get(ONBOARDING_SEEN_KEY, false)).value === "true"; }catch(e){ seenOnboarding = false; }
    }
    if(isNative && !seenOnboarding) view = "onboarding";
    history.replaceState({ view }, "", "");
    render();
    return;
  }

  // Paint instantly from whatever we last saw for this account, if
  // anything — then quietly fetch the real current numbers behind it.
  // Only a brand-new device with no cache yet sees a loading state at all.
  let hadCache = false;
  try{
    state = JSON.parse((await window.storage.get(walletCacheKey(), false)).value);
    view = "home";
    hadCache = true;
    render();
  }catch(e){}

  await loadState(!hadCache);
  loadSiteSettings();

  // Gently auto-advances the Home promo carousel — only actually
  // re-renders while Home is the visible screen, so it can't interrupt
  // someone typing or mid-purchase on another screen.
  setInterval(() => {
    if(view !== "home") return;
    promoSlide = (promoSlide + 1) % PROMO_SLIDES.length;
    render();
  }, 4500);
})();
</script>
